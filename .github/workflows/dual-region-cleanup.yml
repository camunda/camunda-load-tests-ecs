name: Cleanup Dual-Region Load Test

on:
  workflow_dispatch:
    inputs:
      benchmark_name:
        description: 'Dual-region benchmark name, without the dev- prefix (for example camunda-dr)'
        required: true
        type: string
      database_engine:
        description: 'Database engine used by the deployment'
        required: true
        type: choice
        options:
          - postgresql
          - mysql
        default: postgresql
      destroy_vpc:
        description: 'Destroy the dual-region VPC/peering state as well'
        required: false
        type: boolean
        default: true

concurrency:
  group: dual-region-cleanup-${{ inputs.benchmark_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  cleanup:
    name: Destroy dual-region stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@2c5827061f1ad91ca97897d6257ebe638e033699
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/zeebe/ci/common AWS_CORE_FOUNDATION_ACCESS_KEY | AWS_ACCESS_KEY_ID;
            secret/data/products/zeebe/ci/common AWS_CORE_FOUNDATION_SECRET_KEY | AWS_SECRET_ACCESS_KEY;

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.7.0'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate run name
        run: aws/dual-region/scripts/validate-name.sh "dev-${{ inputs.benchmark_name }}"

      - name: Destroy load test
        working-directory: aws/load_test/dev
        run: |
          make destroy \
            BENCHMARK_NAME="${{ inputs.benchmark_name }}-r0" \
            DUAL_REGION=true \
            DUAL_REGION_INFRA_STATE_KEY="dual-region/infra/dev-${{ inputs.benchmark_name }}.tfstate"

      - name: Destroy app (orchestration cluster and connectors)
        working-directory: aws/dual-region/app/dev
        run: make destroy BENCHMARK_NAME="${{ inputs.benchmark_name }}"

      - name: Destroy infra (Aurora Global and ECS clusters)
        working-directory: aws/dual-region/infra/dev
        run: make destroy BENCHMARK_NAME="${{ inputs.benchmark_name }}" DATABASE_ENGINE="${{ inputs.database_engine }}"

      - name: Destroy VPC and cross-region peering
        if: ${{ inputs.destroy_vpc }}
        working-directory: aws/dual-region/vpc/dev
        run: make destroy BENCHMARK_NAME="${{ inputs.benchmark_name }}"

      - name: Cleanup summary
        if: always()
        run: |
          echo "Cleanup requested for dev-${{ inputs.benchmark_name }}"
          echo "Destroyed: load test, orchestration cluster, Aurora Global, ECS clusters"
          if [ "${{ inputs.destroy_vpc }}" = "true" ]; then
            echo "Destroyed: dual-region VPC and peering"
          else
            echo "Preserved: dual-region VPC and peering"
          fi
          echo "Stable VPC states were not touched."
